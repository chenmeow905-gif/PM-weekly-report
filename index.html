<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PM weekly report 專案管理系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2pdf.js for Client-Side PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @page {
      size: A4 landscape;
      margin: 8mm 6mm;
    }
    @media print {
      .no-print, #loginOverlay, #cellColorPalette {
        display: none !important;
      }
      body {
        background: white !important;
        color: #0f172a !important;
        padding: 0 !important;
        margin: 0 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      #app {
        max-width: 100% !important;
        padding: 0 !important;
        gap: 0 !important;
      }
      .page-break {
        page-break-after: always !important;
        break-after: page !important;
      }
      table {
        page-break-inside: auto !important;
      }
      tr {
        page-break-inside: avoid !important;
      }
    }
    
    .touch-scroll {
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    @media (max-width: 1024px) {
      .sticky-col-1 {
        position: sticky;
        left: 0;
        z-index: 10;
        background-color: #f8fafc;
        box-shadow: 2px 0 4px -1px rgba(0,0,0,0.06);
      }
      .sticky-col-header {
        position: sticky;
        left: 0;
        z-index: 30;
        background-color: #e2e8f0;
        box-shadow: 2px 0 4px -1px rgba(0,0,0,0.08);
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased">

  <!-- 登入遮罩 -->
  <div id="loginOverlay" style="position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); padding: 16px; pointer-events: auto;">
    <div style="background: #ffffff; width: 100%; max-width: 420px; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4); border: 1px solid #e2e8f0; overflow: hidden; pointer-events: auto;">
      <div style="background-color: #0f766e; padding: 24px; text-align: center; color: white;">
        <div style="width: 52px; height: 52px; background: rgba(255,255,255,0.15); border-radius: 12px; margin: 0 auto 12px auto; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900;">
          PM
        </div>
        <h2 style="font-size: 19px; font-weight: bold; margin: 0; letter-spacing: -0.5px;">PM 專案管理系統</h2>
        <p style="font-size: 11.5px; color: #ccfbf1; margin: 4px 0 0 0;">請驗證身分以存取專案時程與日報資料</p>
      </div>
      <form id="loginForm" onsubmit="handleLoginSubmit(event)" style="padding: 24px;">
        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 12px; font-weight: bold; color: #334155; margin-bottom: 6px;">使用者姓名</label>
          <input 
            type="text" 
            id="loginUsername" 
            placeholder="請輸入姓名 (例如: Jane)" 
            value="Jane"
            required 
            style="width: 100%; font-size: 13.5px; padding: 10px 12px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; outline: none;"
          />
        </div>
        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 12px; font-weight: bold; color: #334155; margin-bottom: 6px;">通關密碼</label>
          <input 
            type="password" 
            id="loginPassword" 
            placeholder="請輸入密碼 (預設: adsbu1)" 
            required 
            style="width: 100%; font-size: 13.5px; padding: 10px 12px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; outline: none;"
          />
        </div>
        <div id="loginErrorMsg" style="display: none; font-size: 12px; font-weight: 600; color: #e11d48; background: #ffe4e6; padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; text-align: center;"></div>
        <button 
          type="submit" 
          style="width: 100%; background-color: #0f766e; color: white; font-weight: bold; font-size: 14px; padding: 12px; border-radius: 8px; border: none; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: background 0.2s;"
        >
          🔐 登入系統
        </button>
      </form>
      <div style="background: #f8fafc; padding: 10px; border-top: 1px solid #e2e8f0; text-align: center; font-size: 11px; color: #64748b;">
        內部專案控管系統 • 機密資料請勿外傳
      </div>
    </div>
  </div>

  <!-- 主系統容器 -->
  <div id="app" class="w-full flex flex-col p-2 sm:p-4 md:p-6 max-w-[1700px] mx-auto gap-4 sm:gap-6"></div>

  <!-- 浮動調色盤 -->
  <div id="cellColorPalette" class="hidden fixed z-50 bg-white border border-slate-300 rounded-xl shadow-2xl p-3 w-72 text-xs transition-all">
    <div class="flex items-center justify-between border-b border-slate-200 pb-2 mb-2.5">
      <div class="font-bold text-slate-800 flex items-center gap-1.5">
        <span>🎨</span><span>設定醒目標示與文字顏色</span>
      </div>
      <button onclick="closeColorPalette()" class="text-slate-400 hover:text-slate-700 font-bold px-1 text-sm">✕</button>
    </div>
    <div class="mb-3">
      <div class="text-[11px] font-semibold text-slate-500 mb-1.5">快速醒目預設 (底色 + 字色)：</div>
      <div class="grid grid-cols-3 gap-1.5 text-center">
        <button onclick="applyPresetColor('#dbeafe', '#1e40af')" class="p-1 rounded bg-blue-100 text-blue-800 font-bold border border-blue-200">藍色 (需求/DFM)</button>
        <button onclick="applyPresetColor('#fef3c7', '#92400e')" class="p-1 rounded bg-amber-100 text-amber-800 font-bold border border-amber-200">黃色 (採購/備料)</button>
        <button onclick="applyPresetColor('#ffedd5', '#9a3412')" class="p-1 rounded bg-orange-100 text-orange-800 font-bold border border-orange-200">橙色 (組裝/調適)</button>
        <button onclick="applyPresetColor('#d1fae5', '#065f46')" class="p-1 rounded bg-emerald-100 text-emerald-800 font-bold border border-emerald-200">綠色 (完成/Pass)</button>
        <button onclick="applyPresetColor('#ffe4e6', '#9f1239')" class="p-1 rounded bg-rose-100 text-rose-800 font-bold border border-rose-200">紅色 (延遲/異常)</button>
        <button onclick="applyPresetColor('#f3e8ff', '#6b21a8')" class="p-1 rounded bg-purple-100 text-purple-800 font-bold border border-purple-200">紫色 (KO/BOM)</button>
      </div>
    </div>
    <div class="space-y-2 border-t border-slate-200 pt-2.5">
      <div class="flex items-center justify-between">
        <span class="text-slate-600 font-medium">自訂醒目底色:</span>
        <input type="color" id="pickerBg" onchange="applyCustomBg(this.value)" class="w-8 h-6 rounded cursor-pointer border border-slate-300" />
      </div>
      <div class="flex items-center justify-between">
        <span class="text-slate-600 font-medium">自訂文字顏色:</span>
        <input type="color" id="pickerText" onchange="applyCustomText(this.value)" class="w-8 h-6 rounded cursor-pointer border border-slate-300" />
      </div>
    </div>
    <div class="border-t border-slate-200 pt-2.5 mt-2.5 flex items-center justify-between">
      <button onclick="clearCustomColor()" class="text-rose-600 hover:text-rose-800 font-medium text-[11px]">🔄 清除顏色 (預設)</button>
      <button onclick="closeColorPalette()" class="bg-teal-700 hover:bg-teal-800 text-white font-medium px-2.5 py-1 rounded text-xs">完成</button>
    </div>
  </div>

  <script>
    const AUTH_KEY = 'PM_AUTH_USER_SESSION_2026';
    const CORRECT_PASS = 'adsbu1';

    function getLoggedInUser() {
      return sessionStorage.getItem(AUTH_KEY) || '';
    }

    function checkAuth() {
      const user = getLoggedInUser();
      const overlay = document.getElementById('loginOverlay');
      if (!user) {
        if (overlay) {
          overlay.style.display = 'flex';
          overlay.style.pointerEvents = 'auto';
        }
        return false;
      } else {
        if (overlay) {
          overlay.style.display = 'none';
          overlay.style.pointerEvents = 'none';
        }
        return true;
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const userVal = document.getElementById('loginUsername').value.trim();
      const passVal = document.getElementById('loginPassword').value.trim();
      const errEl = document.getElementById('loginErrorMsg');

      if (!userVal) {
        errEl.innerText = '請輸入使用者姓名！';
        errEl.style.display = 'block';
        return;
      }

      if (passVal !== CORRECT_PASS) {
        errEl.innerText = '通關密碼錯誤，請重新輸入！';
        errEl.style.display = 'block';
        return;
      }

      errEl.style.display = 'none';
      sessionStorage.setItem(AUTH_KEY, userVal);
      checkAuth();
      initDataForCurrentTeam();
      renderApp();
    }

    function handleLogout() {
      if (confirm('確定要登出系統嗎？')) {
        sessionStorage.removeItem(AUTH_KEY);
        location.reload();
      }
    }

    let currentTeam = urlParams.get('team') || urlParams.get('group') || '';
    currentTeam = currentTeam.replace(/[^a-zA-Z0-9_\-\u4e00-\u9fa5]/g, '').trim();

    function createBlankProject() {
      return [{
        "id": "proj_" + Date.now(),
        "project": "新專案 #1",
        "location": "TP",
        "cm": "",
        "phase": "",

        "tt_resources": "",

    function createBlankDaily() {
      return [{
        "no": 1,
        "project": "待填寫專案項",
        "actions": ["重點進度..."],
        "risk": "Low",
        "checkpoint": "Daily Check"
      }];
    }

    let viewMode = 'both';
    let weeks = DEFAULT_WEEKS;
    let projects = [];
    let dailyReports = [];
    let dailyReportDate = '2026-11-04';
    let weeklyReportDate = '2026-11-04';
    let selectedId = '';

    function initDataForCurrentTeam() {
      if (!currentTeam) {
        projects = [];
        dailyReports = [];
        selectedId = '';
        return;
      }

      const STORAGE_KEY_PROJ = `PM_SYSTEM_ACTIVE_PROJECTS_${currentTeam}`;
      const STORAGE_KEY_WEEK = `PM_SYSTEM_ACTIVE_WEEKS_${currentTeam}`;
      const STORAGE_KEY_DAILY = `PM_SYSTEM_ACTIVE_DAILY_${currentTeam}`;
      const STORAGE_KEY_DAILY_DATE = `PM_SYSTEM_ACTIVE_DATE_${currentTeam}`;
      const STORAGE_KEY_WEEKLY_DATE = `PM_SYSTEM_ACTIVE_WEEKLY_DATE_${currentTeam}`;

      try {
        const storedProj = localStorage.getItem(STORAGE_KEY_PROJ);
        if (storedProj) {
          projects = JSON.parse(storedProj);
        } else {
          projects = (currentTeam === 'Jane') ? JSON.parse(JSON.stringify(JANE_INITIAL_PROJECTS)) : createBlankProject();
        }

        const storedWeeks = localStorage.getItem(STORAGE_KEY_WEEK);
        if (storedWeeks) {
          weeks = JSON.parse(storedWeeks);
        } else {
          weeks = DEFAULT_WEEKS;
        }

        const storedDaily = localStorage.getItem(STORAGE_KEY_DAILY);
        if (storedDaily) {
          dailyReports = JSON.parse(storedDaily);
        } else {
          dailyReports = (currentTeam === 'Jane') ? JSON.parse(JSON.stringify(JANE_INITIAL_DAILY)) : createBlankDaily();
        }

        const storedDailyDate = localStorage.getItem(STORAGE_KEY_DAILY_DATE);
        if (storedDailyDate) dailyReportDate = storedDailyDate;
        const storedWeeklyDate = localStorage.getItem(STORAGE_KEY_WEEKLY_DATE);
        if (storedWeeklyDate) weeklyReportDate = storedWeeklyDate;
      } catch (e) {
        console.warn('LocalStorage load error:', e);
      }
      selectedId = (projects && projects[0]) ? projects[0].id : '';
    }

    function saveState() {
      if (!currentTeam) return;
      try {
        localStorage.setItem(`PM_SYSTEM_ACTIVE_PROJECTS_${currentTeam}`, JSON.stringify(projects));
        localStorage.setItem(`PM_SYSTEM_ACTIVE_WEEKS_${currentTeam}`, JSON.stringify(weeks));
        localStorage.setItem(`PM_SYSTEM_ACTIVE_DAILY_${currentTeam}`, JSON.stringify(dailyReports));
        localStorage.setItem(`PM_SYSTEM_ACTIVE_DATE_${currentTeam}`, dailyReportDate);
        localStorage.setItem(`PM_SYSTEM_ACTIVE_WEEKLY_DATE_${currentTeam}`, weeklyReportDate);
      } catch (e) {}
    }

    function switchTeam(newTeam) {
      if (newTeam === currentTeam) return;
      saveState();
      const newUrl = new URL(window.location.href);
      if (newTeam) {
        newUrl.searchParams.set('team', newTeam);
      } else {
        newUrl.searchParams.delete('team');
      }
      window.location.href = newUrl.toString();
    }

    function promptNewTeam() {
      const input = prompt('請輸入新組別名稱 (例如: NPI, Automation, Peter):', '');
      if (input && input.trim()) {
        switchTeam(input.trim());
      }
    }

    function setViewMode(m) { 
      viewMode = m; 
      renderApp(); 
    }
    
    function selectProject(id) { 
      if (selectedId !== id) { 
        selectedId = id; 
        renderApp(); 
      } 
    }

    let activePaletteTarget = null;
    function openColorPalette(projId, weekId, btnEl) {
      const proj = projects.find(p => p.id === projId);
      const mItem = (proj && proj.milestones && proj.milestones[weekId]) || '';
      const curBg = (typeof mItem === 'object' && mItem.bg) ? mItem.bg : '#ffffff';
      const curColor = (typeof mItem === 'object' && mItem.color) ? mItem.color : '#0f172a';
      const inputEl = btnEl.parentElement.querySelector('input');
      activePaletteTarget = { projId, weekId, inputEl };

      document.getElementById('pickerBg').value = curBg.startsWith('#') ? curBg : '#dbeafe';
      document.getElementById('pickerText').value = curColor.startsWith('#') ? curColor : '#1e40af';

      const palette = document.getElementById('cellColorPalette');
      palette.classList.remove('hidden');

      const rect = btnEl.getBoundingClientRect();
      let left = rect.left + window.scrollX - 260;
      if (left < 10) left = 10;
      let top = rect.bottom + window.scrollY + 6;
      if (top + 280 > window.innerHeight + window.scrollY) {
        top = rect.top + window.scrollY - 280;
      }
      palette.style.left = `${left}px`;
      palette.style.top = `${top}px`;
    }

    function closeColorPalette() {
      document.getElementById('cellColorPalette').classList.add('hidden');
      activePaletteTarget = null;
    }

    function applyPresetColor(bgColor, textColor) {
      if (!activePaletteTarget) return;
      const { projId, weekId, inputEl } = activePaletteTarget;
      updateMilestoneColor(projId, weekId, inputEl, bgColor, textColor);
      document.getElementById('pickerBg').value = bgColor;
      document.getElementById('pickerText').value = textColor;
    }

    function applyCustomBg(bgColor) {
      if (!activePaletteTarget) return;
      const { projId, weekId, inputEl } = activePaletteTarget;
      const curColor = inputEl.style.color || '#0f172a';
      updateMilestoneColor(projId, weekId, inputEl, bgColor, curColor);
    }

    function applyCustomText(textColor) {
      if (!activePaletteTarget) return;
      const { projId, weekId, inputEl } = activePaletteTarget;
      const curBg = inputEl.style.backgroundColor || '#ffffff';
      updateMilestoneColor(projId, weekId, inputEl, curBg, textColor);
    }

    function clearCustomColor() {
      if (!activePaletteTarget) return;
      const { projId, weekId, inputEl } = activePaletteTarget;
      const proj = projects.find(p => p.id === projId);
      const mItem = (proj && proj.milestones && proj.milestones[weekId]) || '';
      const textVal = typeof mItem === 'object' ? (mItem.text || '') : mItem;
      projects = projects.map(p => {
        if (p.id !== projId) return p;
        return { ...p, milestones: { ...(p.milestones || {}), [weekId]: textVal } };
      });
      saveState();
      inputEl.style.backgroundColor = '';
      inputEl.style.color = '';
      inputEl.className = "w-full text-center text-[10px] leading-tight py-1 pr-3 focus:bg-white rounded font-medium";

      projects = projects.map(p => {

        return {
          ...p,
          milestones: { ...(p.milestones || {}), [weekId]: { text: val, bg: bg, color: color } }
        };
      });
      saveState();
      inputEl.className = "w-full text-center text-[10px] leading-tight py-1 pr-3 rounded font-bold";
      inputEl.style.backgroundColor = bg;
      inputEl.style.color = color;
    }

    function getMonthGroups() {
      if (!weeks || weeks.length === 0) return [];
      const groups = [];
      let curMonth = weeks[0].month || 'Month';
      let span = 0;
      weeks.forEach((w, idx) => {
        const m = w.month || 'Month';
        if (m === curMonth) {
          span++;
        } else {
          groups.push({ month: curMonth, span });
          curMonth = m;
          span = 1;
        }
        if (idx === weeks.length - 1) {
          groups.push({ month: curMonth, span });
        }
      });
      return groups;
    }

    function downloadWeeklyReportPDF() {
      try {
        const curProj = (projects && projects.length > 0) ? (projects.find(p => p.id === selectedId) || projects[0]) : {};
        const reportHtml = generateCleanReportHTML();
        const tempContainer = document.createElement('div');
        tempContainer.innerHTML = reportHtml;

        const opt = {
          margin: [6, 6, 6, 6],
          filename: `PM_Weekly_Report_${currentTeam || 'Group'}_${(curProj.fixture || 'Project').replace(/\s+/g, '_')}_${weeklyReportDate}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, scrollY: 0, scrollX: 0, windowWidth: 1060 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };

        if (typeof html2pdf !== 'undefined') {
          html2pdf().set(opt).from(tempContainer.firstElementChild).save().then(() => {
            document.body.removeChild(tempContainer);
          }).catch(err => {
            document.body.removeChild(tempContainer);
            openDedicatedPrintWindow();

          openDedicatedPrintWindow();
        }
      } catch (e) {
        openDedicatedPrintWindow();

    }

    // 備份資料匯出
    function exportBackupJSON() {
      try {
        const data = {
          version: '2026.11',
          team: currentTeam,
          exportDate: new Date().toISOString(),
          weeklyReportDate: weeklyReportDate,
          dailyReportDate: dailyReportDate,
          projects: projects,
          weeks: weeks,
          dailyReports: dailyReports
        };
        const jsonStr = JSON.stringify(data, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8;' });
        const fileName = `PM_Backup_${currentTeam || 'Group'}_${new Date().toISOString().slice(0, 10)}.json`;

        if (window.navigator && window.navigator.msSaveOrOpenBlob) {
          window.navigator.msSaveOrOpenBlob(blob, fileName);
          return;
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.setAttribute('download', fileName);
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 150);
      } catch (err) {
        alert('備份失敗: ' + err.message);
      }
    }

        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
          try {
            const data = JSON.parse(evt.target.result);
            if (data.projects && Array.isArray(data.projects)) {
              projects = data.projects;
              if (data.weeks) weeks = data.weeks;
              if (data.dailyReports) dailyReports = data.dailyReports;
              if (data.dailyReportDate) dailyReportDate = data.dailyReportDate;
              if (data.weeklyReportDate) weeklyReportDate = data.weeklyReportDate;
              selectedId = projects[0] ? projects[0].id : '';

            alert('❌ 讀取備份檔案失敗: ' + err.message);

        };
        reader.readAsText(file);
      };
      input.click();
    }

                                  type="button" 
                                  title="變更文字色彩與醒目標籤"
                                  onclick="openColorPalette('${proj.id}', '${w.id}', this)"
                                  class="no-print absolute right-0.5 opacity-0 group-hover/cell:opacity-100 transition text-[9px] text-slate-400 hover:text-teal-700 bg-white/80 rounded px-0.5 shadow-sm"
                                >
                                  🎨
                                </button>
                              </div>
                            </td>
                          `;
                        }).join('')}
                        <td class="no-print p-1">
                          <div class="flex items-center justify-center gap-1">
                            <button type="button" onclick="duplicateProject('${proj.id}')" title="複製" class="text-slate-500 hover:text-slate-800 text-xs px-1">複製</button>
                            <button type="button" onclick="deleteProject('${proj.id}')" title="刪除" class="text-rose-600 hover:text-rose-800 text-xs px-1 font-bold">刪除</button>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </section>

          <!-- 模組二：標準單頁週報卡片 (Full Report) -->
          <section id="section-detail" class="${viewMode === 'master' || viewMode === 'daily' ? 'hidden' : ''} bg-white rounded-xl shadow-sm border-2 border-teal-800 overflow-hidden">
            <div class="bg-teal-800 text-white p-3 sm:p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
              <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
                <span class="bg-white/20 text-white text-[11px] sm:text-xs font-bold px-2 py-0.5 rounded flex-shrink-0">Weekly Report</span>
                <input
                  type="text"
                  value="NPI Project (${curProj.fixture || '治具名稱'}) - ${curProj.phase || '階段'}"
                  onblur="commitFixtureTitle('${curProj.id}', this.value)"
                  class="bg-transparent font-bold text-base sm:text-lg text-white border-b border-transparent hover:border-white/50 focus:border-white focus:outline-none flex-1 min-w-[200px]"
                />
                <div class="flex items-center gap-1 text-xs bg-teal-900 border border-teal-600 px-2 py-1 rounded-md text-teal-200">
                  <span>週報日期:</span>
                  <input 
                    type="date" 
                    value="${weeklyReportDate}" 
                    onchange="updateWeeklyDate(this.value)" 
                    class="bg-transparent text-white font-bold text-xs focus:outline-none cursor-pointer" 
                  />
                </div>
              </div>

              <div class="no-print flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto">
                <div class="flex items-center gap-1.5 flex-1 sm:flex-initial">
                  <span class="text-xs text-teal-200 hidden md:inline">切換治具：</span>
                  <select onchange="selectProject(this.value)" class="bg-teal-900 text-white text-xs px-2 py-1.5 rounded border border-teal-700 focus:outline-none w-full sm:w-auto">
                    ${(projects || []).map(p => `<option value="${p.id}" ${p.id === curProj.id ? 'selected' : ''}>${p.fixture || '未命名治具'} (${p.phase || 'N/A'})</option>`).join('')}
                  </select>
                </div>
                <button type="button" onclick="deleteProject('${curProj.id}')" class="text-xs bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1.5 rounded transition flex-shrink-0">刪除</button>
              </div>
            </div>

            <div class="p-3 sm:p-4 md:p-6 space-y-4 text-xs">
              <!-- 1. Stakeholders -->
              <div class="border border-slate-300 rounded-lg overflow-hidden">
                <div class="grid grid-cols-1 md:grid-cols-12 divide-y md:divide-y-0 md:divide-x divide-slate-300">
                  <div class="md:col-span-2 bg-slate-100 font-bold p-2 text-slate-700 flex items-center text-[11px] sm:text-xs">Customer/CM</div>
                  <div class="md:col-span-4 p-1.5"><input type="text" value="${curProj.customer || ''}" placeholder="客戶代號 / 工廠" onblur="commitField('${curProj.id}', 'customer', this.value)" class="w-full p-1 bg-transparent focus:bg-slate-50 rounded" /></div>
                  <div class="md:col-span-2 bg-slate-100 font-bold p-2 text-slate-700 flex items-center text-[11px] sm:text-xs border-t md:border-t-0 border-slate-300">Contact (Customer)</div>
                  <div class="md:col-span-4 p-1.5"><input type="text" value="${curProj.contact_customer || ''}" placeholder="DRI - 聯絡人" onblur="commitField('${curProj.id}', 'contact_customer', this.value)" class="w-full p-1 bg-transparent focus:bg-slate-50 rounded" /></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-12 border-t border-slate-300 divide-y md:divide-y-0 md:divide-x divide-slate-300">
                  <div class="md:col-span-2 bg-slate-100 font-bold p-2 text-slate-700 flex items-center text-[11px] sm:text-xs">Competitor</div>
                  <div class="md:col-span-4 p-1.5"><input type="text" value="${curProj.competitor || 'NA'}" onblur="commitField('${curProj.id}', 'competitor', this.value)" class="w-full p-1 bg-transparent focus:bg-slate-50 rounded" /></div>
                  <div class="md:col-span-2 bg-slate-100 font-bold p-2 text-slate-700 flex items-center text-[11px] sm:text-xs border-t md:border-t-0 border-slate-300">TT Resources</div>
                  <div class="md:col-span-4 p-1.5"><input type="text" value="${curProj.tt_resources || ''}" placeholder="AM / PM / RD / ME 名單" onblur="commitField('${curProj.id}', 'tt_resources', this.value)" class="w-full p-1 bg-transparent focus:bg-slate-50 rounded" /></div>
                </div>
              </div>

              <!-- 2. Demand & PO/PR 查核矩陣 -->
              <div class="border border-slate-300 rounded-lg overflow-hidden">
                <div class="bg-slate-100 px-3 py-2 font-bold text-slate-800 border-b border-slate-300 flex items-center justify-between text-xs">
                  <span>Demand & PO/PR 查核矩陣</span>
                  <button type="button" onclick="addDemand('${curProj.id}')" class="no-print text-xs text-teal-700 hover:text-teal-900 font-semibold">+ 新增需求項</button>
                </div>
                <div class="overflow-x-auto touch-scroll">
                  <table class="w-full text-center border-collapse min-w-[700px]">
                    <thead>
                      <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold text-[11px]">
                        <th class="p-2 border-r border-slate-200 text-left pl-3">Demand 需求名稱</th>
                        <th class="p-2 border-r border-slate-200 w-16">Qty</th>
                        <th class="p-2 border-r border-slate-200 w-24">Site</th>
                        <th class="p-2 border-r border-slate-200 w-20">ETD</th>
                        <th class="p-2 border-r border-slate-200 w-20">ETA</th>
                        <th class="p-2 border-r border-slate-200 w-14">DFM</th>
                        <th class="p-2 border-r border-slate-200 w-14">Quote</th>
                        <th class="p-2 border-r border-slate-200 w-16">PR/PO</th>
                        <th class="p-2 border-r border-slate-200 w-14">K/O</th>
                        <th class="p-2 border-r border-slate-200 w-14">BOM</th>
                        <th class="p-2 border-r border-slate-200 w-14">SW Key</th>
                        <th class="no-print p-2 w-12">操作</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                      ${(curProj.demands || []).map(d => `
                        <tr class="hover:bg-slate-50/70">
                          <td class="p-1.5 border-r border-slate-200 text-left pl-2"><input type="text" value="${d.demand || ''}" placeholder="需求治具品名" onblur="commitDemand('${curProj.id}', '${d.id}', 'demand', this.value)" class="w-full p-1 bg-transparent focus:bg-white rounded" /></td>
                          <td class="p-1 border-r border-slate-200"><input type="text" value="${d.qty || ''}" placeholder="1" onblur="commitDemand('${curProj.id}', '${d.id}', 'qty', this.value)" class="w-full text-center p-1 bg-transparent focus:bg-white rounded" /></td>
                          <td class="p-1 border-r border-slate-200"><input type="text" value="${d.site || ''}" placeholder="廠區" onblur="commitDemand('${curProj.id}', '${d.id}', 'site', this.value)" class="w-full text-center p-1 bg-transparent focus:bg-white rounded" /></td>
                          <td class="p-1 border-r border-slate-200"><input type="text" value="${d.etd || ''}" placeholder="出貨日" onblur="commitDemand('${curProj.id}', '${d.id}', 'etd', this.value)" class="w-full text-center p-1 bg-transparent focus:bg-white rounded" /></td>
                          <td class="p-1 border-r border-slate-200"><input type="text" value="${d.eta || ''}" placeholder="到廠日" onblur="commitDemand('${curProj.id}', '${d.id}', 'eta', this.value)" class="w-full text-center p-1 bg-transparent focus:bg-white rounded text-rose-600 font-semibold" /></td>
                          ${['dfm', 'quote', 'pr_po', 'ko', 'bom', 'sw_key'].map(fKey => `
                            <td class="p-1 border-r border-slate-200"><input type="checkbox" ${d[fKey] ? 'checked' : ''} onchange="commitDemand('${curProj.id}', '${d.id}', '${fKey}', this.checked)" class="w-4 h-4 text-teal-600 rounded cursor-pointer" /></td>
                          `).join('')}
                          <td class="no-print p-1"><button type="button" onclick="deleteDemand('${curProj.id}', '${d.id}')" class="text-slate-400 hover:text-rose-600 p-1 font-bold">×</button></td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- 3. Schedule 說明 -->
              <div class="border border-slate-300 rounded-lg p-2.5 sm:p-3 bg-slate-50/50">
                <div class="font-bold text-slate-800 mb-1 text-xs">Schedule 時程重點</div>
                <input type="text" value="${curProj.schedule_desc || ''}" placeholder="例如: 需求 11/4 ETA 交付工廠，數量 2 套" onblur="commitField('${curProj.id}', 'schedule_desc', this.value)" class="w-full p-2 bg-white border border-slate-300 rounded focus:ring-1 focus:ring-teal-500 focus:outline-none text-xs" />
              </div>

              <!-- 4. Project Progress (Process 週記日誌) -->
              <div class="border border-slate-300 rounded-lg overflow-hidden">
                <div class="bg-slate-100 px-3 py-2 font-bold text-slate-800 border-b border-slate-300 flex items-center justify-between text-xs">
                  <span>Project Progress (Process 歷程日誌)</span>
                  <button type="button" onclick="addLog('${curProj.id}')" class="no-print text-xs text-teal-700 hover:text-teal-900 font-semibold">+ 新增週次日誌</button>
                </div>
                <div class="p-2 sm:p-3 space-y-2.5 max-h-[380px] overflow-y-auto touch-scroll">
                  ${(curProj.progress_logs || []).map(log => `
                    <div class="border border-slate-200 rounded-lg p-2 sm:p-2.5 bg-slate-50/60 relative group">
                      <div class="flex items-center justify-between mb-1.5">
                        <div class="flex items-center gap-1.5 sm:gap-2">
                          <span class="font-bold text-teal-800 bg-teal-100 px-2 py-0.5 rounded text-[11px]">-[${log.week}]</span>
                          <input type="text" value="${log.week}" onblur="commitLog('${curProj.id}', '${log.id}', 'week', this.value)" class="text-xs font-semibold text-slate-700 bg-white border border-slate-300 rounded px-1.5 py-0.5 w-16 sm:w-20" />
                        </div>
                        <button type="button" onclick="deleteLog('${curProj.id}', '${log.id}')" class="no-print text-slate-400 hover:text-rose-600 text-xs px-2 py-0.5 rounded">刪除此週</button>
                      </div>
                      <textarea rows="3" onblur="commitLog('${curProj.id}', '${log.id}', 'content', this.value)" class="w-full text-xs p-2 bg-white border border-slate-300 rounded focus:ring-1 focus:ring-teal-500 focus:outline-none">${log.content || ''}</textarea>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4">
                <div class="border border-amber-300 bg-amber-50/30 rounded-lg p-2.5 sm:p-3">
                  <div class="font-bold text-amber-900 mb-1 text-xs">Special Issue / Highlight / Call Help</div>
                  <textarea rows="3" onblur="commitField('${curProj.id}', 'special_issue', this.value)" class="w-full text-xs p-2 bg-white border border-amber-200 rounded focus:ring-1 focus:ring-amber-500 focus:outline-none">${curProj.special_issue || ''}</textarea>
                </div>
                <div class="border border-teal-300 bg-teal-50/30 rounded-lg p-2.5 sm:p-3">
                  <div class="font-bold text-teal-900 mb-1 text-xs">To-do plan（下週待辦行動方案）</div>
                  <textarea rows="3" onblur="commitField('${curProj.id}', 'todo_plan', this.value)" class="w-full text-xs p-2 bg-white border border-teal-200 rounded focus:ring-1 focus:ring-teal-500 focus:outline-none">${curProj.todo_plan || ''}</textarea>
                </div>
              </div>
            </div>

            <div class="bg-slate-50 border-t border-slate-200 px-3 sm:px-4 py-2 flex items-center justify-between text-[11px] text-slate-500">
              <span>Weekly Report System • ${currentTeam} • 報告日期: ${weeklyReportDate}</span>
              <span>Page 1 of 1</span>
            </div>
          </section>
        `}
      `;

      const updatedScrollContainer = document.getElementById('masterScrollContainer');
      if (updatedScrollContainer && savedScrollLeft > 0) {
        updatedScrollContainer.scrollLeft = savedScrollLeft;
      }
    }

    function liveColorBadge(inputEl) {
      if (inputEl.style.backgroundColor && inputEl.style.backgroundColor !== '') return;
      const val = inputEl.value;
      inputEl.className = "w-full text-center text-[10px] leading-tight py-1 pr-3 focus:bg-white rounded font-medium";
      if (val.includes('DFM') || val.includes('需求')) inputEl.classList.add('bg-blue-100', 'text-blue-800', 'font-bold');
      else if (val.includes('KO') || val.includes('BOM')) inputEl.classList.add('bg-purple-100', 'text-purple-800', 'font-bold');
      else if (val.includes('採購') || val.includes('備料')) inputEl.classList.add('bg-amber-100', 'text-amber-800', 'font-bold');
      else if (val.includes('組裝') || val.includes('調適')) inputEl.classList.add('bg-orange-100', 'text-orange-800', 'font-bold');
      else inputEl.classList.add('bg-transparent', 'text-slate-700');
    }

    function handleCellKey(e, inputEl) {
      if (e.key === 'Enter') inputEl.blur();
    }

    function commitMilestone(projId, weekId, val) {
      projects = projects.map(p => {
        if (p.id !== projId) return p;
        const cur = (p.milestones && p.milestones[weekId]) || '';
        if (typeof cur === 'object') {
          return { ...p, milestones: { ...(p.milestones || {}), [weekId]: { ...cur, text: val } } };
        } else {
          return { ...p, milestones: { ...(p.milestones || {}), [weekId]: val } };
        }
      });
      saveState();
    }

    function commitField(projId, field, val) {
      projects = projects.map(p => p.id === projId ? { ...p, [field]: val } : p);
      saveState();
    }

    function commitFixtureTitle(projId, rawTitle) {
      const fixtureName = rawTitle.replace(/^NPI Project \(凸?/, '').replace(/\) - .*$/, '');
      commitField(projId, 'fixture', fixtureName);
    }

    function commitDemand(projId, demandId, field, val) {
      projects = projects.map(p => {
        if (p.id !== projId) return p;
        return { ...p, demands: (p.demands || []).map(d => d.id === demandId ? { ...d, [field]: val } : d) };
      });
      saveState();
      renderApp();
    }

    function deleteDemand(projId, demandId) {
      projects = projects.map(p => p.id === projId ? { ...p, demands: (p.demands || []).filter(d => d.id !== demandId) } : p);
      saveState();
      renderApp();
    }

    function addLog(projId) {
      projects = projects.map(p => {
        if (p.id !== projId) return p;
        const list = p.progress_logs || [];
        const nextNum = list.length > 0 ? (parseInt(list[0].week.replace(/[^0-9]/g, '') || '44', 10) + 1) : 45;
        const newL = { id: 'log_' + Date.now(), week: `WK${nextNum}`, content: '' };
        return { ...p, progress_logs: [newL, ...list] };
      });
      renderApp();
    }

    function deleteLog(projId, logId) {
      projects = projects.map(p => p.id === projId ? { ...p, progress_logs: (p.progress_logs || []).filter(l => l.id !== logId) } : p);
      renderApp();
    }

    function addNewProject() {
      const p = {
        id: 'proj_' + Date.now(),
        project: `PRJ-0${projects.length + 1}`,
        location: 'TP',
        cm: 'Wistron湖口',
        phase: 'P1',
        fixture: `測試模組治具 #${projects.length + 1}`,
        status: '設計',
        deadline: '11/10',
        pm: 'Jane',
        tpe_rd: 'Eliot',
        tt_ee: 'X',
        me: 'Mark',
        sw: 'X',
        fae: 'X',
        milestones: {},
        customer: 'Lenovo / Wistron湖口',
        contact_customer: 'DRI',
        competitor: 'NA',
        tt_resources: 'AM: Jasmine, PM: Jane, RD: Eliot, ME: Mark',
        demands: [],
        schedule_desc: '',
        progress_logs: [],
        special_issue: '- 目前無重大卡點 (N/A)',
        todo_plan: ''
      };
      projects.push(p);
      selectedId = p.id;
      renderApp();
    }

    function duplicateProject(id) {
      const target = projects.find(p => p.id === id);
      if (!target) return;
      const copy = JSON.parse(JSON.stringify(target));
      copy.id = 'proj_' + Date.now();
      copy.fixture = (copy.fixture || '專案') + ' (副本)';
      projects.push(copy);
      selectedId = copy.id;
      renderApp();
    }

    function deleteProject(id) {
      projects = projects.filter(p => p.id !== id);
      if (projects.length === 0) projects = (currentTeam === 'Jane') ? JSON.parse(JSON.stringify(JANE_INITIAL_PROJECTS)) : createBlankProject();
      selectedId = projects[0].id;
      renderApp();
    }

    function resetToInitialData() {
      if (confirm(`確定要將 [組別: ${currentTeam}] 的週報資料還原回預設嗎？`)) {
        try {
          localStorage.removeItem(`PM_SYSTEM_ACTIVE_PROJECTS_${currentTeam}`);
          localStorage.removeItem(`PM_SYSTEM_ACTIVE_WEEKS_${currentTeam}`);
        } catch (e) {}
        weeks = DEFAULT_WEEKS;
        projects = (currentTeam === 'Jane') ? JSON.parse(JSON.stringify(JANE_INITIAL_PROJECTS)) : createBlankProject();
        selectedId = projects[0].id;
        renderApp();
      }
    }

    function addNewWeek() {
      const lastWeek = weeks[weeks.length - 1];
      let nextWkNum = 1, nextDate = '1/5', nextMonth = 'Jan-27';
      if (lastWeek) {
        const m = lastWeek.week.match(/\d+/);
        if (m) nextWkNum = parseInt(m[0], 10) + 1;
        if (lastWeek.date && lastWeek.date.includes('/')) {
          const [mo, da] = lastWeek.date.split('/').map(n => parseInt(n, 10));
          const d = new Date(2026, mo - 1, da);
          d.setDate(d.getDate() + 7);
          nextDate = `${d.getMonth() + 1}/${d.getDate()}`;
          const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
          nextMonth = `${monthNames[d.getMonth()]}-${String(d.getFullYear()).slice(-2)}`;
        }
      }
      weeks.push({ id: 'w_' + Date.now(), week: `WK${nextWkNum}`, month: nextMonth, date: nextDate });
      renderApp();
    }

    function deleteWeek(id) {
      if (weeks.length <= 1) return;
      weeks = weeks.filter(w => w.id !== id);
      renderApp();
    }

    // 啟動身分檢查與頁面渲染
    if (checkAuth()) {
      initDataForCurrentTeam();
      renderApp();
    }
  </script>
</body>
</html>
