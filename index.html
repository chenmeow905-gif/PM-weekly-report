<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PM weekly report 專案管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; margin: 0 !important; }
      .page-break { page-break-after: always !important; }
      .print-table th, .print-table td { border: 1px solid #cbd5e1 !important; padding: 4px 6px !important; }
    }
    .html2pdf__page-break { page-break-before: always; }
    .touch-scroll { -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @media (max-width: 1024px) {
      .sticky-col-1 { position: sticky; left: 0; z-index: 10; background-color: #f8fafc; box-shadow: 2px 0 4px -1px rgba(0,0,0,0.06); }
      .sticky-col-header { position: sticky; left: 0; z-index: 30; background-color: #e2e8f0; box-shadow: 2px 0 4px -1px rgba(0,0,0,0.08); }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased">
  <div id="app" class="w-full flex flex-col p-2 sm:p-4 md:p-6 max-w-[1700px] mx-auto gap-4 sm:gap-6"></div>

  <!-- 浮動調色盤 -->
  <div id="cellColorPalette" class="hidden fixed z-50 bg-white border border-slate-300 rounded-xl shadow-2xl p-3 w-72 text-xs transition-all">
    <div class="flex items-center justify-between border-b border-slate-200 pb-2 mb-2.5">
      <div class="font-bold text-slate-800 flex items-center gap-1.5">
        <span>🎨</span><span>設定醒目標示與文字顏色</span>
      </div>
      <button onclick="closeColorPalette()" class="text-slate-400 hover:text-slate-700 font-bold px-1 text-sm">✕</button>
    </div>
    <div class="mb-3">
      <div class="text-[11px] font-semibold text-slate-500 mb-1.5">快速醒目預設 (底色 + 字色)：</div>
      <div class="grid grid-cols-3 gap-1.5 text-center">
        <button onclick="applyPresetColor('#dbeafe', '#1e40af')" class="p-1 rounded bg-blue-100 text-blue-800 font-bold border border-blue-200">藍色 (需求/DFM)</button>
        <button onclick="applyPresetColor('#fef3c7', '#92400e')" class="p-1 rounded bg-amber-100 text-amber-800 font-bold border border-amber-200">黃色 (採購/備料)</button>
        <button onclick="applyPresetColor('#ffedd5', '#9a3412')" class="p-1 rounded bg-orange-100 text-orange-800 font-bold border border-orange-200">橙色 (組裝/調適)</button>
        <button onclick="applyPresetColor('#d1fae5', '#065f46')" class="p-1 rounded bg-emerald-100 text-emerald-800 font-bold border border-emerald-200">綠色 (完成/Pass)</button>
        <button onclick="applyPresetColor('#ffe4e6', '#9f1239')" class="p-1 rounded bg-rose-100 text-rose-800 font-bold border border-rose-200">紅色 (延遲/異常)</button>
        <button onclick="applyPresetColor('#f3e8ff', '#6b21a8')" class="p-1 rounded bg-purple-100 text-purple-800 font-bold border border-purple-200">紫色 (KO/BOM)</button>
      </div>
    </div>
    <div class="space-y-2 border-t border-slate-200 pt-2.5">
      <div class="flex items-center justify-between">
        <span class="text-slate-600 font-medium">自訂醒目底色:</span>
        <input type="color" id="pickerBg" onchange="applyCustomBg(this.value)" class="w-8 h-6 rounded cursor-pointer border border-slate-300" />
      </div>
      <div class="flex items-center justify-between">
        <span class="text-slate-600 font-medium">自訂文字顏色:</span>
        <input type="color" id="pickerText" onchange="applyCustomText(this.value)" class="w-8 h-6 rounded cursor-pointer border border-slate-300" />
      </div>
    </div>
    <div class="border-t border-slate-200 pt-2.5 mt-2.5 flex items-center justify-between">
      <button onclick="clearCustomColor()" class="text-rose-600 hover:text-rose-800 font-medium text-[11px]">🔄 清除顏色 (預設)</button>
      <button onclick="closeColorPalette()" class="bg-teal-700 hover:bg-teal-800 text-white font-medium px-2.5 py-1 rounded text-xs">完成</button>
    </div>
  </div>

  <!-- 列印預覽彈窗 -->
  <div id="printModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
    <div class="bg-white rounded-xl sm:rounded-2xl shadow-2xl max-w-5xl w-full max-h-[94vh] flex flex-col overflow-hidden">
      <div class="p-3 sm:p-4 bg-teal-800 text-white flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="font-bold text-sm sm:text-base md:text-lg">正式報告列印與 PDF 匯出預覽</span>
          <span class="text-[10px] sm:text-xs bg-teal-900 px-2 py-0.5 rounded text-teal-200">A4 橫向重點摘要版</span>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2">
          <button onclick="executeModalPrint()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 sm:px-3 py-1.5 rounded-lg font-bold shadow">🖨️ 列印 / 另存PDF</button>
          <button onclick="downloadReportFromModal()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs px-2.5 sm:px-3 py-1.5 rounded-lg font-bold shadow">⬇️ 下載 PDF</button>
          <button onclick="closePrintModal()" class="text-white/80 hover:text-white text-base sm:text-lg font-bold px-2 py-0.5">✕</button>
        </div>
      </div>
      <div class="p-2 sm:p-4 overflow-y-auto flex-1 bg-slate-200/70 touch-scroll" id="modalPreviewBody"></div>
    </div>
  </div>

          { id: 'd1_2', demand: '陪測板 Adapter Board', qty: '2', site: 'USI南投', etd: '11/3', eta: '11/10', dfm: true, quote: true, pr_po: false, ko: false, bom: false, sw_key: false }
        ],

        progress_logs: [
          { id: 'log_1_44', week: 'WK44', content: '1. DFM 描述更新供客戶確認。\n2. 探針已到廠進行 QC 檢驗，彈力回饋正常。\n3. PCB 已發洗板，預計下週一回廠組裝裝針。' },

        todo_plan: '1. 追蹤裝針與調適進度。\n2. 確認洗板回廠時間並安排產線試組裝。'
      },

        fixture: 'Vera Rubin NapaD BFT fixture',
        status: '設計',

        pm: 'Jane',
        tpe_rd: 'Eliot',
        tt_ee: '曉勇/迪良/遠照',
        me: '郭詩音',
        sw: 'X',
        fae: 'X',
        milestones: {
          'w13': { text: '需求確認', bg: '#dbeafe', color: '#1e40af' },
          'w14': { text: 'DFM Lock', bg: '#dbeafe', color: '#1e40af' }
        },
        customer: 'Meta / USI南投',
        contact_customer: 'DRI - Kevin',
        competitor: 'NA',
        tt_resources: 'AM: 徐健, PM: Ryan, RD: Jasper, ME: 郭詩音',
        demands: [
          { id: 'd2_1', demand: 'DUT SIP Socket 治具本體', qty: '1', site: 'USI南投', etd: '10/28', eta: '11/4', dfm: true, quote: true, pr_po: true, ko: true, bom: true, sw_key: false },
          { id: 'd2_2', demand: '陪測板 Adapter Board', qty: '2', site: 'USI南投', etd: '11/3', eta: '11/10', dfm: true, quote: true, pr_po: false, ko: false, bom: false, sw_key: false }
        ],
        schedule_desc: '需求 11/4 ETA 交付工廠，目前探針已到廠檢驗中。',
        progress_logs: [
          { id: 'log_2_44', week: 'WK44', content: '1. DFM 描述更新供客戶確認。\n2. 探針已到廠進行 QC 檢驗，彈力回饋正常。\n3. PCB 已發洗板，預計下週一回廠組裝裝針。' },
          { id: 'log_2_43', week: 'WK43', content: '1. 完成初版線路設計並確認 lock down。\n2. 業務端已發送正式報價單供客戶審核。' }
        ],
        special_issue: '- 目前無重大卡點 (N/A)',
        todo_plan: '1. 追蹤裝針與調適進度。\n2. 確認洗板回廠時間並安排產線試組裝。'
      }
    ];

    let viewMode = 'both';
    let weeks = DEFAULT_WEEKS;
    let projects = INITIAL_PROJECTS;

    try {
      const storedWeeks = localStorage.getItem('PM_SYSTEM_WEEKS_V15');
      if (storedWeeks) weeks = JSON.parse(storedWeeks);
      const storedProjects = localStorage.getItem('PM_SYSTEM_PROJECTS_V15');
      if (storedProjects) {
        projects = JSON.parse(storedProjects);
      } else {
        localStorage.setItem('PM_SYSTEM_PROJECTS_V15', JSON.stringify(INITIAL_PROJECTS));
      }
    } catch (e) {}

    let selectedId = projects.find(p => p.project === 'NNV1') ? projects.find(p => p.project === 'NNV1').id : projects[0].id;

    function saveState() {
      try {
        localStorage.setItem('PM_SYSTEM_WEEKS_V15', JSON.stringify(weeks));
        localStorage.setItem('PM_SYSTEM_PROJECTS_V15', JSON.stringify(projects));
      } catch (e) {}
    }

    let activePaletteTarget = null;

    function openColorPalette(projId, weekId, btnEl) {
      const proj = projects.find(p => p.id === projId);
      const mItem = (proj && proj.milestones && proj.milestones[weekId]) || '';
      const curBg = (typeof mItem === 'object' && mItem.bg) ? mItem.bg : '#ffffff';
      const curColor = (typeof mItem === 'object' && mItem.color) ? mItem.color : '#0f172a';

      const inputEl = btnEl.parentElement.querySelector('input');
      activePaletteTarget = { projId, weekId, inputEl };

      document.getElementById('pickerBg').value = curBg.startsWith('#') ? curBg : '#dbeafe';
      document.getElementById('pickerText').value = curColor.startsWith('#') ? curColor : '#1e40af';

      const palette = document.getElementById('cellColorPalette');
      palette.classList.remove('hidden');

      const rect = btnEl.getBoundingClientRect();
      let left = rect.left + window.scrollX - 260;
      if (left < 10) left = 10;
      let top = rect.bottom + window.scrollY + 6;
      if (top + 280 > window.innerHeight + window.scrollY) {
        top = rect.top + window.scrollY - 280;
      }
      palette.style.left = `${left}px`;
      palette.style.top = `${top}px`;
    }

    function closeColorPalette() {
      document.getElementById('cellColorPalette').classList.add('hidden');
      activePaletteTarget = null;
    }

    function applyPresetColor(bgColor, textColor) {
      if (!activePaletteTarget) return;
      const { projId, weekId, inputEl } = activePaletteTarget;
      updateMilestoneColor(projId, weekId, inputEl, bgColor, textColor);
      document.getElementById('pickerBg').value = bgColor;
      document.getElementById('pickerText').value = textColor;
    }

    function applyCustomBg(bgColor) {
      if (!activePaletteTarget) return;
      const { projId, weekId, inputEl } = activePaletteTarget;
      const curColor = inputEl.style.color || '#0f172a';
      updateMilestoneColor(projId, weekId, inputEl, bgColor, curColor);
    }

    function applyCustomText(textColor) {
      if (!activePaletteTarget) return;
      const { projId, weekId, inputEl } = activePaletteTarget;
      const curBg = inputEl.style.backgroundColor || '#ffffff';
      updateMilestoneColor(projId, weekId, inputEl, curBg, textColor);
    }

    function clearCustomColor() {
      if (!activePaletteTarget) return;
      const { projId, weekId, inputEl } = activePaletteTarget;
      const proj = projects.find(p => p.id === projId);
      const mItem = (proj && proj.milestones && proj.milestones[weekId]) || '';
      const textVal = typeof mItem === 'object' ? (mItem.text || '') : mItem;

      projects = projects.map(p => {
        if (p.id !== projId) return p;
        return { ...p, milestones: { ...(p.milestones || {}), [weekId]: textVal } };
      });
      saveState();

      inputEl.style.backgroundColor = '';
      inputEl.style.color = '';
      inputEl.className = "w-full text-center text-[10px] leading-tight py-1 pr-3 focus:bg-white rounded font-medium";
      liveColorBadge(inputEl);
      closeColorPalette();
    }

    function updateMilestoneColor(projId, weekId, inputEl, bg, color) {
      const val = inputEl.value;
      projects = projects.map(p => {
        if (p.id !== projId) return p;
        return {
          ...p,
          milestones: { ...(p.milestones || {}), [weekId]: { text: val, bg: bg, color: color } }
        };
      });
      saveState();

      inputEl.className = "w-full text-center text-[10px] leading-tight py-1 pr-3 rounded font-bold";
      inputEl.style.backgroundColor = bg;
      inputEl.style.color = color;
    }

    function getMonthGroups() {
      if (weeks.length === 0) return [];
      const groups = [];
      let curMonth = weeks[0].month || 'Month';
      let span = 0;
      weeks.forEach((w, idx) => {
        const m = w.month || 'Month';
        if (m === curMonth) {
          span++;
        } else {
          groups.push({ month: curMonth, span });
          curMonth = m;
          span = 1;
        }
        if (idx === weeks.length - 1) {
          groups.push({ month: curMonth, span });
        }
      });
      return groups;
    }

    function renderApp() {
      const scrollContainer = document.getElementById('masterScrollContainer');
      const savedScrollLeft = scrollContainer ? scrollContainer.scrollLeft : 0;

      saveState();
      const curProj = projects.find(p => p.id === selectedId) || projects[0];
      const monthGroups = getMonthGroups();

            <div>
              <h1 class="text-base sm:text-lg md:text-xl font-bold text-slate-800 tracking-tight flex items-center gap-1.5 sm:gap-2">
                <span>PM weekly report 專案管理系統</span>
                <span class="text-[10px] sm:text-xs px-2 py-0.5 rounded-full bg-teal-100 text-teal-800 font-medium">清晰字色版</span>
              </h1>
              <p class="text-[11px] sm:text-xs text-slate-500">已調整 TT EE、SW、FAE 字體為清晰深色，並放寬欄位避免文字遮蔽</p>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
            <div class="bg-slate-100 p-0.5 sm:p-1 rounded-lg flex text-[11px] sm:text-xs font-semibold border border-slate-200">
              <button onclick="setViewMode('both')" class="px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-md transition ${viewMode === 'both' ? 'bg-white text-teal-800 shadow-sm font-bold' : 'text-slate-600'}">雙模式</button>
              <button onclick="setViewMode('master')" class="px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-md transition ${viewMode === 'master' ? 'bg-white text-teal-800 shadow-sm font-bold' : 'text-slate-600'}">總排程</button>
              <button onclick="setViewMode('detail')" class="px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-md transition ${viewMode === 'detail' ? 'bg-white text-teal-800 shadow-sm font-bold' : 'text-slate-600'}">單頁週報</button>
            </div>
            <button onclick="addNewProject()" class="bg-teal-700 hover:bg-teal-800 text-white text-[11px] sm:text-xs px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg font-medium shadow-sm transition">+ 治具</button>
            <button onclick="openPrintModal()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-[11px] sm:text-xs px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1"><span>📄</span><span>匯出 PDF</span></button>
            <button onclick="openDedicatedPrintWindow()" class="bg-slate-800 hover:bg-slate-900 text-white text-[11px] sm:text-xs px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg font-medium shadow-sm transition hidden sm:inline-block">列印</button>
            <button onclick="resetToInitialData()" class="text-[11px] sm:text-xs text-rose-600 hover:bg-rose-50 px-2 py-1.5 rounded-lg transition">恢復報告資訊</button>
          </div>
        </header>

        <section id="section-master" class="${viewMode === 'detail' ? 'hidden' : ''} bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">

              <h2 class="text-sm sm:text-base font-bold text-slate-800 tracking-tight">PM weekly report</h2>
              <span class="text-[11px] sm:text-xs text-slate-400">（共 ${projects.length} 項治具，點選「專案」切換週報，點擊 🎨 設定醒目顏色）</span>
            </div>
            <div class="no-print flex items-center gap-1.5 sm:gap-2">
              <button onclick="addNewWeek()" class="text-[11px] sm:text-xs bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold px-2 py-1 sm:px-2.5 sm:py-1.5 rounded-md transition">+ 新增週次</button>
              <button onclick="addNewProject()" class="text-[11px] sm:text-xs bg-teal-600 hover:bg-teal-700 text-white font-medium px-2 py-1 sm:px-2.5 sm:py-1.5 rounded-md transition">+ 新增治具</button>
            </div>
          </div>

          <div id="masterScrollContainer" class="overflow-x-auto touch-scroll max-h-[520px] text-xs">
            <table class="w-full border-collapse text-center min-w-[1320px]">

    function liveColorBadge(inputEl) {
      if (inputEl.style.backgroundColor && inputEl.style.backgroundColor !== '') return;
      const val = inputEl.value;
      inputEl.className = "w-full text-center text-[10px] leading-tight py-1 pr-3 focus:bg-white rounded font-medium";
      if (val.includes('DFM') || val.includes('需求')) inputEl.classList.add('bg-blue-100', 'text-blue-800', 'font-bold');
      else if (val.includes('KO') || val.includes('BOM')) inputEl.classList.add('bg-purple-100', 'text-purple-800', 'font-bold');
      else if (val.includes('採購') || val.includes('備料')) inputEl.classList.add('bg-amber-100', 'text-amber-800', 'font-bold');
      else if (val.includes('組裝') || val.includes('調適')) inputEl.classList.add('bg-orange-100', 'text-orange-800', 'font-bold');
      else inputEl.classList.add('bg-transparent', 'text-slate-700');
    }

    function handleCellKey(e, inputEl) {
      if (e.key === 'Enter') inputEl.blur();
    }

    function commitMilestone(projId, weekId, val) {
      projects = projects.map(p => {
        if (p.id !== projId) return p;
        const cur = (p.milestones && p.milestones[weekId]) || '';
        if (typeof cur === 'object') {
          return { ...p, milestones: { ...(p.milestones || {}), [weekId]: { ...cur, text: val } } };
        } else {
          return { ...p, milestones: { ...(p.milestones || {}), [weekId]: val } };
        }
      });
      saveState();
    }

    function commitField(projId, field, val) {
      projects = projects.map(p => p.id === projId ? { ...p, [field]: val } : p);
      saveState();
    }

    function commitFixtureTitle(projId, rawTitle) {
      const fixtureName = rawTitle.replace(/^NPI Project \(凸?/, '').replace(/\) - .*$/, '');
      commitField(projId, 'fixture', fixtureName);
    }

    function commitDemand(projId, demandId, field, val) {
      projects = projects.map(p => p.id === projId ? { ...p, demands: (p.demands || []).map(d => d.id === demandId ? { ...d, [field]: val } : d) } : p);
      saveState();
    }

    function commitLog(projId, logId, field, val) {
      projects = projects.map(p => p.id === projId ? { ...p, progress_logs: (p.progress_logs || []).map(l => l.id === logId ? { ...l, [field]: val } : l) } : p);
      saveState();
    }

    function selectProject(id) { if (selectedId !== id) { selectedId = id; renderApp(); } }

      const p = {
        id: 'proj_' + Date.now(),

        cm: 'USI南投',
        phase: 'P1',

    function duplicateProject(id) {
      const target = projects.find(p => p.id === id);
      if (!target) return;
      const copy = JSON.parse(JSON.stringify(target));
      copy.id = 'proj_' + Date.now();
      copy.fixture = (copy.fixture || '專案') + ' (副本)';
      projects.push(copy);
      selectedId = copy.id;
      renderApp();
    }

    function deleteProject(id) {
      projects = projects.filter(p => p.id !== id);
      if (projects.length === 0) projects = [INITIAL_PROJECTS[0]];
      selectedId = projects[0].id;
      renderApp();
    }

    function resetToInitialData() {
      try {
        localStorage.removeItem('PM_SYSTEM_PROJECTS_V15');
        localStorage.removeItem('PM_SYSTEM_WEEKS_V15');
      } catch (e) {}
      weeks = DEFAULT_WEEKS;
      projects = JSON.parse(JSON.stringify(INITIAL_PROJECTS));
      selectedId = projects[1].id;
      renderApp();
    }

    function addNewWeek() {
      const lastWeek = weeks[weeks.length - 1];
      let nextWkNum = 1, nextDate = '1/5', nextMonth = 'Jan-27';
      if (lastWeek) {
        const m = lastWeek.week.match(/\d+/);
        if (m) nextWkNum = parseInt(m[0], 10) + 1;
        if (lastWeek.date && lastWeek.date.includes('/')) {
          const [mo, da] = lastWeek.date.split('/').map(n => parseInt(n, 10));
          const d = new Date(2026, mo - 1, da);
          d.setDate(d.getDate() + 7);
          nextDate = `${d.getMonth() + 1}/${d.getDate()}`;
          const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
          nextMonth = `${monthNames[d.getMonth()]}-${String(d.getFullYear()).slice(-2)}`;
        }
      }
      weeks.push({ id: 'w_' + Date.now(), week: `WK${nextWkNum}`, month: nextMonth, date: nextDate });
      renderApp();
    }

    function deleteWeek(id) {
      if (weeks.length <= 1) return;
      weeks = weeks.filter(w => w.id !== id);
      renderApp();
    }

    function addDemand(projId) {
      projects = projects.map(p => {
        if (p.id !== projId) return p;
        const newD = { id: 'd_' + Date.now(), demand: '', qty: '1', site: 'USI南投', etd: '', eta: '', dfm: true, quote: false, pr_po: false, ko: false, bom: false, sw_key: false };
        return { ...p, demands: [...(p.demands || []), newD] };
      });
      renderApp();
    }

    function deleteDemand(projId, demandId) {
      projects = projects.map(p => p.id === projId ? { ...p, demands: (p.demands || []).filter(d => d.id !== demandId) } : p);
      renderApp();
    }

    function addLog(projId) {
      projects = projects.map(p => {
        if (p.id !== projId) return p;
        const list = p.progress_logs || [];
        const nextNum = list.length > 0 ? (parseInt(list[0].week.replace(/[^0-9]/g, '') || '44', 10) + 1) : 45;
        const newL = { id: 'log_' + Date.now(), week: `WK${nextNum}`, content: '' };
        return { ...p, progress_logs: [newL, ...list] };
      });
      renderApp();
    }

    function deleteLog(projId, logId) {
      projects = projects.map(p => p.id === projId ? { ...p, progress_logs: (p.progress_logs || []).filter(l => l.id !== logId) } : p);

    function executeModalPrint() { openDedicatedPrintWindow(); }

    function downloadReportFromModal() {
      const curProj = projects.find(p => p.id === selectedId) || projects[0];
      const tempContainer = document.createElement('div');
      tempContainer.innerHTML = generateCleanReportHTML();
      document.body.appendChild(tempContainer);
      const opt = {
        margin: [5, 5, 5, 5],
        filename: `PM_Weekly_Report_${(curProj.fixture || 'Project').replace(/\\s+/g, '_')}_${new Date().toISOString().slice(0, 10)}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, scrollY: 0, scrollX: 0, windowWidth: 1100 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
      };
      html2pdf().set(opt).from(tempContainer.firstElementChild).save().then(() => {
        document.body.removeChild(tempContainer);
      });
    }

      const reportHtml = generateCleanReportHTML();
      const printWindow = window.open('', '_blank', 'width=1150,height=850');

        alert('請允許此網頁開啟彈出式視窗，以進行正式列印與 PDF 另存！');
