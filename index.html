  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; margin: 0 !important; }
      .page-break { page-break-after: always !important; }
      .print-table th, .print-table td { border: 1px solid #cbd5e1 !important; padding: 4px 6px !important; }
    }
    .html2pdf__page-break { page-break-before: always; }
    .touch-scroll { -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @media (max-width: 1024px) {
      .sticky-col-1 { position: sticky; left: 0; z-index: 10; background-color: #f8fafc; box-shadow: 2px 0 4px -1px rgba(0,0,0,0.06); }
      .sticky-col-header { position: sticky; left: 0; z-index: 30; background-color: #e2e8f0; box-shadow: 2px 0 4px -1px rgba(0,0,0,0.08); }
    }
  </style>
</head>

        </div>
        <div class="flex items-center gap-1.5 sm:gap-2">
          <button onclick="executeModalPrint()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 sm:px-3 py-1.5 rounded-lg font-bold shadow transition flex items-center gap-1">
            <span>🖨️</span><span class="hidden sm:inline">瀏覽器列印 / </span><span>另存PDF</span>
          </button>
          <button onclick="downloadReportFromModal()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs px-2.5 sm:px-3 py-1.5 rounded-lg font-bold shadow transition flex items-center gap-1">
            <span>⬇️</span><span>下載 PDF</span>
          </button>
          <button onclick="closePrintModal()" class="text-white/80 hover:text-white text-base sm:text-lg font-bold px-2 py-0.5">✕</button>
        </div>
      </div>
      <div class="p-2 sm:p-4 overflow-y-auto flex-1 bg-slate-200/70 touch-scroll" id="modalPreviewBody"></div>
