<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PM weekly report 專案管理系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2pdf.js for Client-Side PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; margin: 0 !important; }
      .page-break { page-break-after: always !important; }
      .print-table th, .print-table td { border: 1px solid #cbd5e1 !important; padding: 4px 6px !important; }
    }
    .html2pdf__page-break { page-break-before: always; }
    
    .touch-scroll {
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    @media (max-width: 1024px) {
      .sticky-col-1 {
        position: sticky;
        left: 0;
        z-index: 10;
        background-color: #f8fafc;
        box-shadow: 2px 0 4px -1px rgba(0,0,0,0.06);
      }
      .sticky-col-header {
        position: sticky;
        left: 0;
        z-index: 30;
        background-color: #e2e8f0;
        box-shadow: 2px 0 4px -1px rgba(0,0,0,0.08);
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased">
  <!-- 登入驗證遮罩與彈窗 -->
  <div id="loginOverlay" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 overflow-hidden transform transition-all">
      <div class="bg-teal-800 p-6 text-white text-center">
        <div class="w-14 h-14 bg-white/10 rounded-2xl mx-auto flex items-center justify-center text-2xl font-black mb-3 shadow-inner">
          PM
        </div>
        <h2 class="text-xl font-bold tracking-tight">PM 專案管理系統</h2>
        <p class="text-xs text-teal-200 mt-1">請驗證身分以存取專案時程與日報資料</p>
      </div>
      <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">使用者姓名</label>
          <input 
            type="text" 
            id="loginUsername" 
            placeholder="請輸入您的姓名 (例如: Jane)" 
            required 
            class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-transparent transition"
          />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">通關密碼</label>
          <input 
            type="password" 
            id="loginPassword" 
            placeholder="請輸入密碼" 
            required 
            class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-transparent transition"
          />
        </div>
        <div id="loginErrorMsg" class="hidden text-xs font-semibold text-rose-600 bg-rose-50 p-2.5 rounded-lg border border-rose-200 text-center"></div>
        <button 
          type="submit" 
          class="w-full bg-teal-700 hover:bg-teal-800 text-white font-bold text-sm py-2.5 rounded-lg shadow-md hover:shadow-lg transition flex items-center justify-center gap-1.5"
        >
          <span>🔐</span><span>登入系統</span>
        </button>
      </form>
      <div class="bg-slate-50 px-6 py-3 border-t border-slate-200 text-center text-[11px] text-slate-500">
        內部專案控管系統 • 機密資料請勿外傳
      </div>
    </div>
  </div>

  <div id="app" class="w-full flex flex-col p-2 sm:p-4 md:p-6 max-w-[1700px] mx-auto gap-4 sm:gap-6"></div>

  <!-- 浮動調色盤 -->
  <div id="cellColorPalette" class="hidden fixed z-50 bg-white border border-slate-300 rounded-xl shadow-2xl p-3 w-72 text-xs transition-all">
    <div class="flex items-center justify-between border-b border-slate-200 pb-2 mb-2.5">
      <div class="font-bold text-slate-800 flex items-center gap-1.5">
        <span>🎨</span><span>設定醒目標示與文字顏色</span>
      </div>
      <button onclick="closeColorPalette()" class="text-slate-400 hover:text-slate-700 font-bold px-1 text-sm">✕</button>
    </div>
    <div class="mb-3">
      <div class="text-[11px] font-semibold text-slate-500 mb-1.5">快速醒目預設 (底色 + 字色)：</div>
      <div class="grid grid-cols-3 gap-1.5 text-center">
        <button onclick="applyPresetColor('#dbeafe', '#1e40af')" class="p-1 rounded bg-blue-100 text-blue-800 font-bold border border-blue-200">藍色 (需求/DFM)</
